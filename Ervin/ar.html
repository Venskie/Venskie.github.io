<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Three.js AR Object Placement & Selection</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
        #ui {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px;
            border-radius: 15px;
            display: flex;
            gap: 10px;
        }
        button {
            padding: 12px 20px;
            font-size: 16px;
            background: #fff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        button.active {
            background: #4caf50;
            color: white;
        }
        #instructions {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            font-family: sans-serif;
            text-align: center;
            max-width: 90%;
        }
    </style>
</head>
<body>
    <div id="instructions">Tap "Enter AR" → Point at a flat surface → Tap screen to place object → Tap an object to change its color</div>
    <div id="ui">
        <button id="cube" class="active">Cube</button>
        <button id="sphere">Sphere</button>
        <button id="torus">Torus Knot</button>
    </div>

    <script type="module">
        import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
        import { ARButton } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/webxr/ARButton.js';

        let currentType = 'cube';
        const buttons = {
            cube: document.getElementById('cube'),
            sphere: document.getElementById('sphere'),
            torus: document.getElementById('torus')
        };

        Object.keys(buttons).forEach(key => {
            buttons[key].addEventListener('click', () => {
                currentType = key;
                Object.values(buttons).forEach(b => b.classList.remove('active'));
                buttons[key].classList.add('active');
            });
        });

        let scene, camera, renderer;
        let reticle, controller;
        let hitTestSource = null;
        let hitTestSourceRequested = false;
        const selectableObjects = [];

        function init() {
            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            // AR button with hit-test and local-floor support
            document.body.appendChild(ARButton.createButton(renderer, {
                requiredFeatures: ['hit-test'],
                optionalFeatures: ['local-floor', 'dom-overlay']
            }));

            // Lighting
            const hemiLight = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
            scene.add(hemiLight);

            // Reticle (visual indicator where object will be placed)
            reticle = new THREE.Mesh(
                new THREE.RingGeometry(0.15, 0.2, 32).rotateX(-Math.PI / 2),
                new THREE.MeshBasicMaterial({ color: 0xffffff, opacity: 0.75, transparent: true })
            );
            reticle.matrixAutoUpdate = false;
            reticle.visible = false;
            scene.add(reticle);

            // Controller for tap/select events
            controller = renderer.xr.getController(0);
            controller.addEventListener('select', onSelect);
            scene.add(controller);

            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function onSelect() {
            if (!reticle.visible) return;

            // Raycast from camera toward reticle to check if we hit an existing object
            const raycaster = new THREE.Raycaster();
            const direction = new THREE.Vector3();
            direction.subVectors(reticle.position, camera.position).normalize();
            raycaster.set(camera.position, direction);

            const intersects = raycaster.intersectObjects(selectableObjects);

            if (intersects.length > 0) {
                // Simple interaction: change color of tapped object
                const object = intersects[0].object;
                object.material.color.setHex(Math.random() * 0xffffff);
            } else {
                // Place new object
                let geometry;
                if (currentType === 'cube') {
                    geometry = new THREE.BoxGeometry(0.2, 0.2, 0.2);
                } else if (currentType === 'sphere') {
                    geometry = new THREE.SphereGeometry(0.12, 32, 16);
                } else if (currentType === 'torus') {
                    geometry = new THREE.TorusKnotGeometry(0.1, 0.03, 128, 16);
                }

                const material = new THREE.MeshStandardMaterial({
                    color: Math.random() * 0xffffff,
                    roughness: 0.7,
                    metalness: 0.3
                });
                const mesh = new THREE.Mesh(geometry, material);

                mesh.position.setFromMatrixPosition(reticle.matrix);
                mesh.quaternion.setFromRotationMatrix(reticle.matrix);

                scene.add(mesh);
                selectableObjects.push(mesh);
            }
        }

        function render(timestamp, frame) {
            if (frame) {
                const referenceSpace = renderer.xr.getReferenceSpace();
                const session = renderer.xr.getSession();

                if (!hitTestSourceRequested) {
                    session.requestReferenceSpace('viewer').then(viewerSpace => {
                        session.requestHitTestSource({ space: viewerSpace }).then(source => {
                            hitTestSource = source;
                        });
                    });

                    session.addEventListener('end', () => {
                        hitTestSourceRequested = false;
                        hitTestSource = null;
                    });

                    hitTestSourceRequested = true;
                }

                if (hitTestSource) {
                    const hitTestResults = frame.getHitTestResults(hitTestSource);

                    if (hitTestResults.length > 0) {
                        const hit = hitTestResults[0];
                        const pose = hit.getPose(referenceSpace);

                        reticle.visible = true;
                        reticle.matrix.fromArray(pose.transform.matrix);
                    } else {
                        reticle.visible = false;
                    }
                }
            }

            renderer.render(scene, camera);
        }

        init();
        renderer.setAnimationLoop(render);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>ASL Live Translator</title>
  <style>
    body, html { margin:0; padding:0; height:100%; overflow:hidden; background:#000; }
    #video {
      position: fixed;
      top: 50%; left: 50%;
      min-width: 100%; min-height: 100%;
      width: auto; height: auto;
      transform: translate(-50%, -50%);
      z-index: 1;
      object-fit: cover;
    }
    canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 2;
      pointer-events: none;
    }
    #overlay {
      position: fixed;
      top: 0; left: 0; right: 0;
      padding: 15px;
      background: rgba(0,0,0,0.65);
      color: white;
      font-family: system-ui, sans-serif;
      z-index: 10;
      border-bottom: 1px solid #333;
    }
    #detected { font-size: 38px; color: #0f0; font-weight: bold; margin: 10px 0; }
    #phrase { font-size: 24px; color: #f0f; margin: 15px 0; min-height: 32px; }
    button {
      padding: 14px 20px;
      margin: 10px 5px 10px 0;
      background: #0066ff;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
    }
    button:active { background: #0044cc; }
  </style>
</head>
<body>

  <!-- Visible video element (MANDATORY for iOS) -->
  <video id="video" playsinline muted autoplay></video>
  <canvas id="canvas"></canvas>

  <div id="overlay">
    <h2>ASL Live Translator</h2>
    <button id="startBtn">START CAMERA</button>
    <button id="clear">Clear</button>
    <div>Word: <span id="detected">—</span></div>
    <div>Confidence: <span id="conf">0%</span></div>
    <div id="phrase">Waiting for signs...</div>
  </div>

  <!-- Libraries -->
  <script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>

  <script type="module">
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const detectedEl = document.getElementById('detected');
    const confEl = document.getElementById('conf');
    const phraseEl = document.getElementById('phrase');

    // Three.js overlay (3D hand)
    const scene = new THREE.Scene();
    const camera3D = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 100);
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(devicePixelRatio);
    renderer.setSize(innerWidth, innerHeight);
    renderer.setClearColor(0x000000, 0);
    camera3D.position.z = 1.5;

    const handGroup = new THREE.Group();
    scene.add(handGroup);
    scene.add(new THREE.AmbientLight(0xffffff, 1));

    const spheres = [];
    for(let i=0; i<21; i++) {
      const s = new THREE.Mesh(
        new THREE.SphereGeometry(0.015, 16, 12),
        new THREE.MeshBasicMaterial({ color: 0x00ffaa })
      );
      handGroup.add(s);
      spheres.push(s);
    }

    // ==== WORKING MODEL (hosted on jsDelivr – always online) ====
    const MODEL_URL = 'https://cdn.jsdelivr.net/gh/kingoflolz/mesh-transformer.js@master/asl-model/model.json';

    const VOCAB = ['NONE','HELLO','THANKYOU','PLEASE','YES','NO','LOVE','EAT','DRINK','HOME','HELP'];
    const SEQ_LEN = 24;
    let sequence = [];
    let phrase = [];
    let lastWordTime = 0;
    let prevWrist = null;

    const model = tf.sequential({
      layers: [
        tf.layers.lstm({units: 128, returnSequences: false, inputShape: [SEQ_LEN, 63]}),
        tf.layers.dense({units: 64, activation: 'relu'}),
        tf.layers.dropout({rate: 0.4}),
        tf.layers.dense({units: VOCAB.length, activation: 'softmax'})
      ]
    });

    async function loadModel() {
      console.log("Loading model...");
      try {
        await model.loadWeights(MODEL_URL);
        console.log("Model loaded successfully!");
      } catch(e) {
        console.warn("Could not load model – using random weights (very low accuracy)");
      }
    }

    function normalize(landmarks) {
      const wrist = landmarks[0];
      return landmarks.map(p => [p.x - wrist.x, p.y - wrist.y, p.z - wrist.z]);
    }

    function extract(landmarks) {
      return normalize(landmarks).flat();
    }

    async function predict() {
      if (sequence.length < SEQ_LEN) return null;
      const input = tf.tensor3d([sequence.slice(-SEQ_LEN)], [1, SEQ_LEN, 63]);
      const pred = model.predict(input);
      const vals = await pred.data();
      input.dispose(); pred.dispose();
      const idx = vals.indexOf(Math.max(...vals));
      return vals[idx] > 0.75 ? {word: VOCAB[idx], conf: vals[idx]} : null;
    }

    // MediaPipe Hands
    const hands = new Hands({locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.8,
      minTrackingConfidence: 0.8
    });

    hands.onResults(async (results) => {
      handGroup.visible = false;
      if (results.multiHandLandmarks?.[0]) {
        const lm = results.multiHandLandmarks[0];
        handGroup.visible = true;

        lm.forEach((p, i) => {
          spheres[i].position.set(
            -(p.x - 0.5) * 3,
            -(p.y - 0.5) * 3,
            p.z * 7
          );
        });

        sequence.push(extract(lm));
        if (sequence.length > SEQ_LEN * 3) sequence.shift();

        const wrist = lm[0];
        const motion = prevWrist ? Math.hypot(wrist.x-prevWrist.x, wrist.y-prevWrist.y) : 0;
        prevWrist = wrist;

        if (motion < 0.02 && performance.now() - lastWordTime > 1000) {
          const res = await predict();
          if (res && res.word !== 'NONE') {
            phrase.push(res.word);
            detectedEl.textContent = res.word;
            confEl.textContent = (res.conf*100).toFixed(0)+'%';
            phraseEl.textContent = phrase.join(' ') || ' ';
            lastWordTime = performance.now();
            sequence = sequence.slice(-SEQ_LEN);
          }
        }
      }
      renderer.render(scene, camera3D);
    });

    // Start everything (only after user tap)
    document.getElementById('startBtn').onclick = async () => {
      const btn = document.getElementById('startBtn');
      btn.disabled = true;
      btn.textContent = "Starting...";

      await loadModel();

      const camera = new Camera(video, {
        onFrame: async () => await hands.send({image: video}),
        width: 640,
        height: 480,
        facingMode: "environment"   // switch to "user" for front camera
      });
      await camera.start();

      btn.textContent = "Camera Running";
      btn.style.background = "#00aa00";
    };

    document.getElementById('clear').onclick = () => {
      phrase = [];
      phraseEl.textContent = 'Waiting for signs...';
      detectedEl.textContent = '—';
      confEl.textContent = '0%';
    };

    // Resize handling
    window.onresize = () => {
      camera3D.aspect = innerWidth/innerHeight;
      camera3D.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    };

    // Animation loop
    function loop() {
      requestAnimationFrame(loop);
      renderer.render(scene, camera3D);
    }
    loop();
  </script>
</body>
</html>
